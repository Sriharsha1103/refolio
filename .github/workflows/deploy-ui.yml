name: Deploy Refolio UI to GoDaddy

on:
  push:
    branches:
      - prod_new

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: ./refolio
        run: npm ci

      - name: Build UI
        working-directory: ./refolio
        run: npm run build

      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "refolio/build/*"
          target: "/var/www/html/refolio"
          strip_components: 2
