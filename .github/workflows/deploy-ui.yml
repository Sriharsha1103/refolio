name: Deploy Refolio UI to GoDaddy

on:
  push:
    branches:
      - prod_new
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build UI
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://bvrithcloud.com/ref
        run: CI=false npm run build

      - name: Upload build to /refolio
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          tar -czf build.tar.gz -C frontend/build .
          ssh -i private_key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "mkdir -p /var/www/html/refolio"
          scp -i private_key.pem -o StrictHostKeyChecking=no build.tar.gz $SERVER_USER@$SERVER_HOST:/var/www/html/refolio
          ssh -i private_key.pem -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "tar -xzf /var/www/html/refolio/build.tar.gz -C /var/www/html/refolio && rm /var/www/html/refolio/build.tar.gz"
          # strip_components is not a supported option for appleboy/scp-action.
          # Remove it or replace with 'rm' and 'tar' logic if you need path rewriting.
          # strip_components: 3
